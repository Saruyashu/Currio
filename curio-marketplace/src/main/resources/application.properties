# =======================================================================
# CURIO MARKETPLACE CONFIGURATION
# =======================================================================

# Database connection pool (HikariCP)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:curio_marketplace}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:password}

# HikariCP Pool settings
db.pool.maxSize=20
db.pool.minIdle=5
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1200000

# Marketplace platform business rules
marketplace.platform_fee_percent=5.0
marketplace.auction.default_increment=50.00
marketplace.auction.minimum_duration_minutes=30
marketplace.auction.anti_sniping_extension_seconds=120

# Escrow & Payment simulation
payment.provider=CURIO_VAULT_ESCROW
payment.webhook_secret=curio_sec_prod_live_8912739281729
